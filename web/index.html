<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quench3D 编辑器 — Web 客户端</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0e14; color: #d7dce5;
               font: 14px/1.6 -apple-system, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
               overflow: hidden; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #stage { position: relative; flex: 1; min-height: 0; }
  /* 画布铺满整个工作区：界面（工具栏/场景树/属性面板）本身就是引擎用 egui 画上去的，
     所以页面这边不抢任何像素，只负责"给一张画布 + 探后端 + 收文件"。 */
  canvas { display: block; width: 100%; height: 100%; background: #0b0e14;
           outline: none; touch-action: none; }
  #overlay { position: absolute; inset: 0; display: flex; align-items: center;
             justify-content: center; flex-direction: column; gap: 10px; pointer-events: none;
             background: radial-gradient(circle at 50% 40%, #16203a 0%, #0b0e14 70%); }
  #overlay.hidden { display: none; }
  .spinner { width: 34px; height: 34px; border: 3px solid #24304a; border-radius: 50%; }
  .spinner { border-color: #24304a; border-top-color: #6ea8fe; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status { font-size: 13px; color: #93a1b8; text-align: center; max-width: 36em; }
  #status.error { color: #ff8a80; }
  #status code { background: #1b2331; padding: 0 4px; border-radius: 4px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="quench3d-canvas" tabindex="0"></canvas>
    <div id="overlay">
      <div class="spinner"></div>
      <div id="status">正在初始化 WebGPU / WebGL2…</div>
    </div>
  </div>
</div>

<script type="module">
// wasm-bindgen 生成的胶水代码（由 tools/build_web.sh web_client 输出到 web/pkg/）
import init, { start, on_scene_file } from "./pkg/quench3d_web.js";

const overlay = document.getElementById("overlay");
const status = document.getElementById("status");

function fail(message) {
  overlay.classList.remove("hidden");
  status.classList.add("error");
  status.innerHTML = message;
}

// 选渲染后端：**先探再定**，不要交给 wgpu 自己"两个都试"。
//
// 原因（踩过的坑）：wgpu 只要看到请求里有 BROWSER_WEBGPU、且 navigator.gpu 存在，
// 就直接走 WebGPU 上下文，连 WebGL2 实例都不建 —— 而 navigator.gpu 存在
// 不等于有适配器（Linux Chrome 没开 Vulkan、软件光栅环境都这样），于是报
// "No available adapters"，说好的 WebGL2 回退永远轮不到。
// 更麻烦的是：一旦对着这张画布要过 webgpu 上下文，再 getContext("webgl2")
// 就返回 null（一张画布只能有一种上下文，且不可逆），回退彻底没戏。
// 所以这里用 requestAdapter() 探一次（**不碰画布**），把结论交给 Rust。
async function pickBackend() {
  const forced = (new URLSearchParams(location.search).get("backend") || "").toLowerCase();
  if (["gl", "gles", "webgl2", "webgpu", "wgpu", "all"].includes(forced)) {
    return { mode: forced, why: "URL 指定 backend=" + forced };
  }
  if (!("gpu" in navigator) || !navigator.gpu) {
    return { mode: "gl", why: "浏览器没有 WebGPU（navigator.gpu 不存在）" };
  }
  try {
    const adapter = await navigator.gpu.requestAdapter();
    if (adapter) return { mode: "webgpu", why: "探测到 WebGPU 适配器" };
    return { mode: "gl", why: "navigator.gpu 存在但没有适配器（比如没开 Vulkan）" };
  } catch (err) {
    return { mode: "gl", why: "WebGPU 探测失败：" + err };
  }
}

// 打开场景文件：Rust 侧（场景面板的「打开」按钮）调这里，
// 读好文本再交回 on_scene_file(name, text) —— 文件读取在浏览器里做，
// wasm 侧不收 File 对象，只收字符串。
window.__quench3d_pick_scene_file = function (suggestedName) {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = ".json,application/json";
  input.style.display = "none";
  input.addEventListener("change", () => {
    const file = input.files && input.files[0];
    if (!file) { input.remove(); return; }
    file
      .text()
      .then((text) => {
        on_scene_file(file.name, text);
        console.info(`[Quench3D] 已读入场景文件 ${file.name}（${text.length} 字节）`);
      })
      .catch((err) => console.error("[Quench3D] 读取场景文件失败", err))
      .finally(() => input.remove());
  });
  document.body.appendChild(input);
  input.click();
};

// 画布上的右键/中键是相机操作（egui 侧也吃滚轮来滚面板），
// 所以屏蔽浏览器右键菜单与页面级滚动/缩放。
const canvas = document.getElementById("quench3d-canvas");
canvas.addEventListener("contextmenu", (e) => e.preventDefault());
canvas.addEventListener("wheel", (e) => e.preventDefault(), { passive: false });
canvas.addEventListener("auxclick", (e) => e.preventDefault());

async function boot() {
  try {
    await init();
  } catch (err) {
    fail("加载 WebAssembly 失败：" + err);
    return;
  }
  const backend = await pickBackend();
  globalThis.__quench3d_backend = backend.mode;
  const label = backend.mode === "webgpu" ? "WebGPU 优先（WebGL2 兜底）" : "WebGL2";
  status.textContent = `渲染后端：${label} —— ${backend.why}`;
  console.info(`[Quench3D] 后端选择：${backend.mode}（${backend.why}）`);
  try {
    // 这里**故意不隐藏遮罩**：遮罩由引擎在「第一帧真的画出来」之后收掉
    // （Rust 侧 web_console::mark_ready）。启动失败时引擎会把原因写进 #status，
    // 页面不会「假装启动成功」然后给你一块黑屏。
    start();
  } catch (err) {
    fail(
      "启动编辑器失败：" + err +
      "<br><br>如果是 <code>No available adapters</code>，试试 " +
      '<a href="?backend=gl">?backend=gl</a>（强制 WebGL2）或 ' +
      '<a href="?backend=webgpu">?backend=webgpu</a>。'
    );
    console.error(err);
  }
}

window.addEventListener("error", (e) => {
  if (overlay.classList.contains("hidden")) fail("运行时错误：" + e.message);
});

boot();
</script>
</body>
</html>
