[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# MSRV（最低支持的 Rust 版本）。依据是整张依赖图里各 crate 自己声明的 rust-version：
# wgpu 30.0.1 / naga / wgpu-core 要求 1.87，image 0.25.10 要求 1.88，
# wgpu-hal 拉进来的 ordered-float 5.5.0 要求 1.90 —— 取其中最大者。
# 这个数字现在**由 CI 验证**：`.github/workflows/ci.yml` 的 `msrv (1.90)` 腿用 1.90.0
# 工具链对工作区成员（编辑器除外，见下）跑 `cargo check --locked --all-targets`。
# 本机与其余 CI 腿仍用 stable：2026-10-16 是 1.99.0。升级依赖时两条腿都要看。
# 例外：`quench3d-editor` 单独声明 1.95 —— egui 0.37 要求它，而 egui 0.37 是
# 唯一同时满足「MSRV 可用」与「依赖 wgpu 30」的版本（0.35 还在 wgpu 29 上）。
rust-version = "1.90"
license = "MIT OR Apache-2.0"
authors = ["Quench3D contributors"]
description = "Quench3D — a pure-Rust 3D engine with built-in physics for desktop and web"
readme = "README.md"
keywords = ["game-engine", "3d", "graphics", "physics", "wgpu"]
categories = ["game-engines", "rendering", "graphics", "wasm"]
# 仓库公开地址（2026-10-16 建立独立仓库时填上；首次 `cargo publish` 前必须是真实 URL，
# 不要留占位地址——crates.io 会把占位链接直接展示给用户）。
repository = "https://github.com/gh503/quench3d"
homepage = "https://github.com/gh503/quench3d"
documentation = "https://docs.rs/quench3d"

[workspace.dependencies]
quench3d-math = { path = "crates/quench3d-math", version = "0.1.0" }
quench3d-physics = { path = "crates/quench3d-physics", version = "0.1.0" }
quench3d-render = { path = "crates/quench3d-render", version = "0.1.0" }
quench3d = { path = "crates/quench3d", version = "0.1.0" }
# 场景文件（`quench3d.scene`）与无窗口渲染/仿真的实现都在 CLI 库里，
# 编辑器/其它宿主程序复用它，避免同一个格式两份实现。
quench3d-cli = { path = "crates/quench3d-cli", version = "0.1.0" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
